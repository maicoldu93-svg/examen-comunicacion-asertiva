<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Interactivo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    color:#222;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1,h2,h3{
    text-align:center;
}

.hidden{
    display:none !important;
}

/* INICIO */

#inicio{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    text-align:center;
    font-size:45px;
    font-weight:bold;
    color:#667eea;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

button{
    border:none;
    border-radius:12px;
    padding:15px 20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-profesor{
    background:#667eea;
    color:white;
}

.btn-estudiante{
    background:#764ba2;
    color:white;
}

.btn{
    width:100%;
    margin-top:10px;
    background:#667eea;
    color:white;
}

.btn-danger{
    background:#e74c3c;
    color:white;
}

/* INPUTS */

input{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:17px;
    margin:8px 0;
    outline:none;
}

input:focus{
    border-color:#667eea;
}

/* HEADER */

.header-game{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.codigo{
    background:#667eea;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
    font-size:20px;
}

.temporizador-global{
    background:#222;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
    font-size:20px;
}

.temporizador-pregunta{
    background:#f39c12;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
    font-size:20px;
    text-align:center;
    margin:15px auto;
    max-width:180px;
}

/* JUGADORES */

.lista-jugadores{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin:20px 0;
}

.jugador{
    background:#f3f4ff;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* PREGUNTA */

.pregunta{
    font-size:28px;
    font-weight:bold;
    text-align:center;
    margin:30px 0;
}

.opciones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.opcion{
    min-height:80px;
    color:white;
    font-size:20px;
}

.opcion-a{
    background:#e74c3c;
}

.opcion-b{
    background:#3498db;
}

.opcion-c{
    background:#f1c40f;
}

.opcion-d{
    background:#2ecc71;
}

.opcion:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* RESULTADO */

.resultado{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
}

.ranking{
    margin-top:25px;
}

.ranking-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    margin:8px 0;
    background:#f5f5f5;
    border-radius:12px;
}

.posicion{
    font-size:22px;
    font-weight:bold;
    width:50px;
}

.nombre-ranking{
    flex:1;
    font-weight:bold;
}

.puntos-ranking{
    font-weight:bold;
    color:#667eea;
}

.correctas-ranking{
    margin-left:15px;
    color:#555;
}

/* MENSAJES */

.mensaje{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
}

.exito{
    color:#27ae60;
}

.error{
    color:#e74c3c;
}

/* RESPONSIVE */

@media(max-width:600px){

    .roles{
        grid-template-columns:1fr;
    }

    .opciones{
        grid-template-columns:1fr;
    }

    .pregunta{
        font-size:22px;
    }

    .header-game{
        justify-content:center;
    }

    .card{
        padding:20px;
    }

}

</style>

</head>

<body>

<!-- =========================
     INICIO
========================= -->

<div id="inicio">

<div class="container">

<div class="card">

<div class="logo">
    ⚡ QUIZ
</div>

<div class="subtitulo">
    Quiz interactivo en tiempo real
</div>

<div class="roles">

<button class="btn-profesor" onclick="mostrarProfesor()">
    👨‍🏫 Profesor
</button>

<button class="btn-estudiante" onclick="mostrarEstudiante()">
    👨‍🎓 Estudiante
</button>

</div>

</div>

</div>

</div>


<!-- =========================
     PROFESOR
========================= -->

<div id="profesor" class="hidden">

<div class="container">

<div class="card">

<div class="header-game">

<h2>👨‍🏫 Panel del profesor</h2>

<div id="temporizadorProfesor"
     class="temporizador-global">
    ⏳ 05:00
</div>

</div>

<div id="crearPartidaPanel">

<button class="btn"
        onclick="crearPartida()">

🎮 Crear nueva partida

</button>

     style="display:inline-block;margin-top:10px">
    ------

<h3>👥 Jugadores</h3>

<div id="listaJugadores"
     class="lista-jugadores">

</div>


<div id="esperandoProfesor">

<button class="btn"
        onclick="iniciarPartida()">

▶️ Iniciar quiz

</button>

</div>


<div id="quizProfesor"
     class="hidden">

<div id="numeroPreguntaProfesor"
     style="text-align:center;font-weight:bold">
</div>

<div id="preguntaProfesor"
     class="pregunta">
</div>

<button class="btn"
        onclick="siguientePregunta()">

➡️ Siguiente pregunta

</button>

</div>


<div id="finalProfesor"
     class="hidden">

<h2>🏆 Quiz finalizado</h2>

<div id="rankingProfesor"
     class="ranking">

</div>

</div>

</div>

</div>

</div>

</div>


<!-- =========================
     ESTUDIANTE
========================= -->

<div id="estudiante" class="hidden">

<div class="container">

<div class="card">

<div class="header-game">

<h2>👨‍🎓 Estudiante</h2>

<div id="temporizadorEstudiante"
     class="temporizador-global">
    ⏳ 05:00
</div>

</div>


<div id="unirsePanel">

<input
    id="codigoInput"
    type="text"
    maxlength="6"
    placeholder="Código de partida">

<input
    id="nombreInput"
    type="text"
    placeholder="Tu nombre">

<button class="btn"
        onclick="unirsePartida()">

🚀 Unirse

</button>

<div id="mensajeEstudiante"
     class="mensaje">

</div>

</div>


<div id="esperandoEstudiante"
     class="hidden">

<h2>⏳ Esperando...</h2>

<p style="text-align:center">
    Te has unido correctamente.
</p>

<p style="text-align:center">
    Espera a que el profesor inicie el quiz.
</p>

</div>


<div id="quizEstudiante"
     class="hidden">

<div id="numeroPregunta"
     style="text-align:center;font-weight:bold">
</div>

<div id="temporizadorPregunta"
     class="temporizador-pregunta">

⏱️ 50

</div>

<div id="preguntaEstudiante"
     class="pregunta">
</div>

<div class="opciones">

<button
    class="opcion opcion-a"
    onclick="responder('A')">

A

</button>

<button
    class="opcion opcion-b"
    onclick="responder('B')">

B

</button>

<button
    class="opcion opcion-c"
    onclick="responder('C')">

C

</button>

<button
    class="opcion opcion-d"
    onclick="responder('D')">

D

</button>

</div>

<div id="resultadoRespuesta"
     class="resultado">

</div>

</div>


<div id="finalEstudiante"
     class="hidden">

<h2>🏆 Resultado final</h2>

<div id="miResultado"
     class="resultado">

</div>

<div id="rankingEstudiante"
     class="ranking">

</div>

</div>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ohmtgkmbrxwtalyamdcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ec57o1PkClVIioHISyei8A_v_Qj619r";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let partidaActual = null;

let jugadorActual = null;

let preguntas = [];

let preguntaActual = 0;

let inicioPregunta = null;

let intervaloPregunta = null;

let intervaloGlobal = null;

let respuestaEnviada = false;

let canalPartida = null;

let canalJugadores = null;

const DURACION_PREGUNTA = 50;

const DURACION_PARTIDA = 300;


/* =====================================================
   CAMBIAR PANTALLAS
===================================================== */

function mostrarProfesor(){

    document.getElementById("inicio")
        .classList.add("hidden");

    document.getElementById("profesor")
        .classList.remove("hidden");

}


function mostrarEstudiante(){

    document.getElementById("inicio")
        .classList.add("hidden");

    document.getElementById("estudiante")
        .classList.remove("hidden");

}


/* =====================================================
   CREAR PARTIDA
===================================================== */

async function crearPartida(){

    try{

        const codigo =
            Math.floor(
                100000 +
                Math.random() * 900000
            ).toString();


        const { data, error } =
            await supabaseClient
            .from("partidas")
            .insert({

                codigo: codigo,

                estado: "esperando",

                pregunta_actual: 0,

                duracion_segundos:
                    DURACION_PARTIDA

            })
            .select()
            .single();


        if(error){

            console.error(error);

            alert(
                "Error creando la partida: " +
                error.message
            );

            return;

        }


        partidaActual = data;


        document
            .getElementById("crearPartidaPanel")
            .classList.add("hidden");


        document
            .getElementById("partidaProfesor")
            .classList.remove("hidden");


        document
            .getElementById("codigoPartida")
            .textContent =
                codigo;


        cargarPreguntas();

        escucharJugadores();

        escucharPartidaProfesor();


    }catch(error){

        console.error(error);

        alert(
            "Ocurrió un error."
        );

    }

}


/* =====================================================
   CARGAR PREGUNTAS
===================================================== */

async function cargarPreguntas(){

    const { data, error } =
        await supabaseClient
        .from("preguntas")
        .select("*")
        .order("id");


    if(error){

        console.error(error);

        alert(
            "Error cargando preguntas: " +
            error.message
        );

        return;

    }


    preguntas = data || [];


    console.log(
        "Preguntas cargadas:",
        preguntas
    );

}


/* =====================================================
   ESCUCHAR JUGADORES
===================================================== */

function escucharJugadores(){

    if(canalJugadores){

        supabaseClient
        .removeChannel(
            canalJugadores
        );

    }


    canalJugadores =
        supabaseClient
        .channel(
            "jugadores-" +
            partidaActual.id
        )
        .on(

            "postgres_changes",

            {
                event:"*",

                schema:"public",

                table:"jugadores",

                filter:
                    "partida_id=eq." +
                    partidaActual.id

            },

            function(){

                cargarJugadores();

            }

        )
        .subscribe();


    cargarJugadores();

}


/* =====================================================
   CARGAR JUGADORES
===================================================== */

async function cargarJugadores(){

    if(!partidaActual)
        return;


    const { data, error } =
        await supabaseClient
        .from("jugadores")
        .select("*")
        .eq(
            "partida_id",
            partidaActual.id
        )
        .order(
            "puntos",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        return;

    }


    const lista =
        document.getElementById(
            "listaJugadores"
        );


    lista.innerHTML = "";


    (data || []).forEach(
        jugador => {

            const div =
                document.createElement("div");

            div.className =
                "jugador";

            div.innerHTML =
                "👤 " +
                escapeHtml(
                    jugador.nombre
                );

            lista.appendChild(div);

        }
    );

}


/* =====================================================
   INICIAR PARTIDA
===================================================== */

async function iniciarPartida(){

    if(!preguntas.length){

        await cargarPreguntas();

    }


    if(!preguntas.length){

        alert(
            "No hay preguntas disponibles."
        );

        return;

    }


    const inicio =
        new Date().toISOString();


    const { data, error } =
        await supabaseClient
        .from("partidas")
        .update({

            estado:"jugando",

            pregunta_actual:1,

            tiempo_inicio:inicio,

            duracion_segundos:
                DURACION_PARTIDA

        })
        .eq(
            "id",
            partidaActual.id
        )
        .select()
        .single();


    if(error){

        console.error(error);

        alert(
            "No se pudo iniciar: " +
            error.message
        );

        return;

    }


    partidaActual = data;


    document
        .getElementById(
            "esperandoProfesor"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "quizProfesor"
        )
        .classList.remove("hidden");


    mostrarPreguntaProfesor(
        1
    );


    iniciarTemporizadorGlobal();

}


/* =====================================================
   MOSTRAR PREGUNTA PROFESOR
===================================================== */

function mostrarPreguntaProfesor(numero){

    const indice =
        numero - 1;


    if(!preguntas[indice])
        return;


    const pregunta =
        preguntas[indice];


    document
        .getElementById(
            "numeroPreguntaProfesor"
        )
        .textContent =
            "Pregunta " +
            numero +
            " de " +
            preguntas.length;


    document
        .getElementById(
            "preguntaProfesor"
        )
        .textContent =
            pregunta.pregunta;

}


/* =====================================================
   SIGUIENTE PREGUNTA
===================================================== */

async function siguientePregunta(){

    if(!partidaActual)
        return;


    const siguiente =
        Number(
            partidaActual.pregunta_actual
        ) + 1;


    if(
        siguiente >
        preguntas.length
    ){

        await finalizarPartida();

        return;

    }


    const { data, error } =
        await supabaseClient
        .from("partidas")
        .update({

            pregunta_actual:
                siguiente

        })
        .eq(
            "id",
            partidaActual.id
        )
        .select()
        .single();


    if(error){

        console.error(error);

        return;

    }


    partidaActual = data;


    mostrarPreguntaProfesor(
        siguiente
    );

}


/* =====================================================
   UNIR ESTUDIANTE
===================================================== */

async function unirsePartida(){

    const codigo =
        document
        .getElementById(
            "codigoInput"
        )
        .value
        .trim();


    const nombre =
        document
        .getElementById(
            "nombreInput"
        )
        .value
        .trim();


    const mensaje =
        document
        .getElementById(
            "mensajeEstudiante"
        );


    if(!codigo || !nombre){

        mensaje.textContent =
            "Completa el código y tu nombre.";

        mensaje.className =
            "mensaje error";

        return;

    }


    mensaje.textContent =
        "Conectando...";

    mensaje.className =
        "mensaje";


    const { data: partida, error } =
        await supabaseClient
        .from("partidas")
        .select("*")
        .eq(
            "codigo",
            codigo
        )
        .maybeSingle();


    if(error){

        console.error(error);

        mensaje.textContent =
            "Error buscando la partida.";

        mensaje.className =
            "mensaje error";

        return;

    }


    if(!partida){

        mensaje.textContent =
            "No existe esa partida.";

        mensaje.className =
            "mensaje error";

        return;

    }


    if(
        partida.estado ===
        "finalizada"
    ){

        mensaje.textContent =
            "La partida ya terminó.";

        mensaje.className =
            "mensaje error";

        return;

    }


    if(
        partida.estado ===
        "jugando"
    ){

        mensaje.textContent =
            "La partida ya comenzó.";

        mensaje.className =
            "mensaje error";

        return;

    }


    const { data: jugador, error: errorJugador } =
        await supabaseClient
        .from("jugadores")
        .insert({

            partida_id:
                partida.id,

            nombre:
                nombre,

            puntos:0,

            correctas:0

        })
        .select()
        .single();


    if(errorJugador){

        console.error(errorJugador);

        mensaje.textContent =
            "No se pudo ingresar: " +
            errorJugador.message;

        mensaje.className =
            "mensaje error";

        return;

    }


    partidaActual =
        partida;


    jugadorActual =
        jugador;


    document
        .getElementById(
            "unirsePanel"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "esperandoEstudiante"
        )
        .classList.remove("hidden");


    escucharPartidaEstudiante();


}


/* =====================================================
   ESCUCHAR PARTIDA ESTUDIANTE
===================================================== */

function escucharPartidaEstudiante(){

    if(canalPartida){

        supabaseClient
        .removeChannel(
            canalPartida
        );

    }


    canalPartida =
        supabaseClient
        .channel(
            "partida-estudiante-" +
            partidaActual.id
        )
        .on(

            "postgres_changes",

            {

                event:"UPDATE",

                schema:"public",

                table:"partidas",

                filter:
                    "id=eq." +
                    partidaActual.id

            },

            payload => {

                partidaActual =
                    payload.new;


                comprobarEstadoEstudiante();

            }

        )
        .subscribe();


    setTimeout(
        comprobarEstadoEstudiante,
        500
    );

}


/* =====================================================
   COMPROBAR ESTADO ESTUDIANTE
===================================================== */

async function comprobarEstadoEstudiante(){

    if(!partidaActual)
        return;


    const { data, error } =
        await supabaseClient
        .from("partidas")
        .select("*")
        .eq(
            "id",
            partidaActual.id
        )
        .single();


    if(error){

        console.error(error);

        return;

    }


    partidaActual =
        data;


    if(
        partidaActual.estado ===
        "jugando"
    ){

        document
            .getElementById(
                "esperandoEstudiante"
            )
            .classList.add("hidden");


        document
            .getElementById(
                "quizEstudiante"
            )
            .classList.remove("hidden");


        cargarPreguntaEstudiante(
            Number(
                partidaActual.pregunta_actual
            )
        );


        iniciarTemporizadorGlobal();

    }


    if(
        partidaActual.estado ===
        "finalizada"
    ){

        mostrarFinalEstudiante();

    }

}


/* =====================================================
   CARGAR PREGUNTA ESTUDIANTE
===================================================== */

async function cargarPreguntaEstudiante(numero){

    const indice =
        numero - 1;


    if(indice < 0)
        return;


    if(indice >= preguntas.length){

        await cargarPreguntas();

    }


    let pregunta =
        preguntas[indice];


    if(!pregunta){

        const { data, error } =
            await supabaseClient
            .from("preguntas")
            .select("*")
            .order("id");


        if(error){

            console.error(error);

            return;

        }


        preguntas =
            data || [];


        pregunta =
            preguntas[indice];

    }


    if(!pregunta)
        return;


    respuestaEnviada =
        false;


    detenerTemporizadorPregunta();


    inicioPregunta =
        Date.now();


    document
        .getElementById(
            "numeroPregunta"
        )
        .textContent =
            "Pregunta " +
            numero +
            " de " +
            preguntas.length;


    document
        .getElementById(
            "preguntaEstudiante"
        )
        .textContent =
            pregunta.pregunta;


    document
        .getElementById(
            "resultadoRespuesta"
        )
        .textContent = "";


    const botones =
        document.querySelectorAll(
            ".opcion"
        );


    botones.forEach(
        boton => {

            boton.disabled =
                false;

        }
    );


    botones[0].textContent =
        "A. " +
        pregunta.opcion_a;

    botones[1].textContent =
        "B. " +
        pregunta.opcion_b;

    botones[2].textContent =
        "C. " +
        pregunta.opcion_c;

    botones[3].textContent =
        "D. " +
        pregunta.opcion_d;


    iniciarTemporizadorPregunta();

}


/* =====================================================
   TEMPORIZADOR PREGUNTA
===================================================== */

function iniciarTemporizadorPregunta(){

    detenerTemporizadorPregunta();


    actualizarTemporizadorPregunta();


    intervaloPregunta =
        setInterval(

            actualizarTemporizadorPregunta,

            250

        );

}


/* =====================================================
   ACTUALIZAR TIEMPO PREGUNTA
===================================================== */

function actualizarTemporizadorPregunta(){

    if(!inicioPregunta)
        return;


    const transcurrido =
        (Date.now() -
        inicioPregunta) / 1000;


    const restante =
        Math.max(
            0,
            Math.ceil(
                DURACION_PREGUNTA -
                transcurrido
            )
        );


    document
        .getElementById(
            "temporizadorPregunta"
        )
        .textContent =
            "⏱️ " +
            restante;


    if(restante <= 0){

        detenerTemporizadorPregunta();


        if(!respuestaEnviada){

            respuestaEnviada =
                true;


            bloquearOpciones();


            document
                .getElementById(
                    "resultadoRespuesta"
                )
                .textContent =
                    "⏰ Tiempo agotado";


            document
                .getElementById(
                    "resultadoRespuesta"
                )
                .className =
                    "resultado error";

        }

    }

}


/* =====================================================
   DETENER TEMPORIZADOR PREGUNTA
===================================================== */

function detenerTemporizadorPregunta(){

    if(intervaloPregunta){

        clearInterval(
            intervaloPregunta
        );

        intervaloPregunta =
            null;

    }

}


/* =====================================================
   RESPONDER
===================================================== */

async function responder(respuesta){

    if(respuestaEnviada)
        return;


    if(!inicioPregunta)
        return;


    respuestaEnviada =
        true;


    detenerTemporizadorPregunta();


    bloquearOpciones();


    const tiempoTranscurrido =
        (Date.now() -
        inicioPregunta) / 1000;


    const tiempoRestante =
        Math.max(
            0,
            Math.min(
                DURACION_PREGUNTA,
                DURACION_PREGUNTA -
                tiempoTranscurrido
            )
        );


    const pregunta =
        preguntas[
            Number(
                partidaActual.pregunta_actual
            ) - 1
        ];


    if(!pregunta)
        return;


    const correcta =
        String(
            respuesta
        ).toUpperCase() ===
        String(
            pregunta.respuesta_correcta
        ).toUpperCase();


    let puntos = 0;


    if(correcta){

        puntos =
            Math.round(
                1000 *
                tiempoRestante /
                DURACION_PREGUNTA
            );

    }


    const mensaje =
        document
        .getElementById(
            "resultadoRespuesta"
        );


    if(correcta){

        mensaje.textContent =
            "✅ Correcta +" +
            puntos +
            " puntos";

        mensaje.className =
            "resultado exito";

    }else{

        mensaje.textContent =
            "❌ Incorrecta +0 puntos";

        mensaje.className =
            "resultado error";

    }


    const { error: errorRespuesta } =
        await supabaseClient
        .from("respuestas")
        .insert({

            partida_id:
                partidaActual.id,

            jugador_id:
                jugadorActual.id,

            pregunta_id:
                pregunta.id,

            respuesta:
                respuesta,

            correcta:
                correcta,

            puntos:
                puntos

        });


    if(errorRespuesta){

        console.error(
            "Error guardando respuesta:",
            errorRespuesta
        );

        return;

    }


    const nuevosPuntos =
        Number(
            jugadorActual.puntos || 0
        ) +
        puntos;


    const nuevasCorrectas =
        Number(
            jugadorActual.correctas || 0
        ) +
        (
            correcta
            ? 1
            : 0
        );


    const { data, error } =
        await supabaseClient
        .from("jugadores")
        .update({

            puntos:
                nuevosPuntos,

            correctas:
                nuevasCorrectas

        })
        .eq(
            "id",
            jugadorActual.id
        )
        .select()
        .single();


    if(error){

        console.error(
            "Error actualizando jugador:",
            error
        );

        return;

    }


    jugadorActual =
        data;

}


/* =====================================================
   BLOQUEAR OPCIONES
===================================================== */

function bloquearOpciones(){

    const botones =
        document.querySelectorAll(
            ".opcion"
        );


    botones.forEach(
        boton => {

            boton.disabled =
                true;

        }
    );

}


/* =====================================================
   TEMPORIZADOR GLOBAL 5 MINUTOS
===================================================== */

function iniciarTemporizadorGlobal(){

    detenerTemporizadorGlobal();


    actualizarTemporizadorGlobal();


    intervaloGlobal =
        setInterval(

            actualizarTemporizadorGlobal,

            500

        );

}


/* =====================================================
   ACTUALIZAR TEMPORIZADOR GLOBAL
===================================================== */

function actualizarTemporizadorGlobal(){

    if(!partidaActual)
        return;


    if(!partidaActual.tiempo_inicio)
        return;


    const inicio =
        new Date(
            partidaActual.tiempo_inicio
        ).getTime();


    const duracion =
        Number(
            partidaActual.duracion_segundos ||
            DURACION_PARTIDA
        );


    const fin =
        inicio +
        duracion * 1000;


    const restante =
        Math.max(
            0,
            Math.ceil(
                (fin - Date.now()) /
                1000
            )
        );


    const minutos =
        Math.floor(
            restante / 60
        );


    const segundos =
        restante % 60;


    const texto =
        "⏳ " +
        String(minutos)
            .padStart(2,"0") +
        ":" +
        String(segundos)
            .padStart(2,"0");


    const profesor =
        document.getElementById(
            "temporizadorProfesor"
        );


    const estudiante =
        document.getElementById(
            "temporizadorEstudiante"
        );


    if(profesor)
        profesor.textContent =
            texto;


    if(estudiante)
        estudiante.textContent =
            texto;


    if(restante <= 0){

        detenerTemporizadorGlobal();


        finalizarPartida();

    }

}


/* =====================================================
   DETENER TEMPORIZADOR GLOBAL
===================================================== */

function detenerTemporizadorGlobal(){

    if(intervaloGlobal){

        clearInterval(
            intervaloGlobal
        );

        intervaloGlobal =
            null;

    }

}


/* =====================================================
   FINALIZAR PARTIDA
===================================================== */

async function finalizarPartida(){

    if(!partidaActual)
        return;


    const { data, error } =
        await supabaseClient
        .from("partidas")
        .update({

            estado:
                "finalizada"

        })
        .eq(
            "id",
            partidaActual.id
        )
        .eq(
            "estado",
            "jugando"
        )
        .select()
        .maybeSingle();


    if(error){

        console.error(
            "Error finalizando:",
            error
        );

        return;

    }


    if(data){

        partidaActual =
            data;

    }


    detenerTemporizadorPregunta();

    detenerTemporizadorGlobal();


    if(
        document
        .getElementById(
            "profesor"
        )
        .classList
        .contains("hidden")
    ){

        mostrarFinalEstudiante();

    }else{

        mostrarFinalProfesor();

    }

}


/* =====================================================
   ESCUCHAR CAMBIOS DE PARTIDA - PROFESOR
===================================================== */

function escucharPartidaProfesor(){

    const canal =
        supabaseClient
        .channel(
            "partida-profesor-" +
            partidaActual.id
        )
        .on(

            "postgres_changes",

            {

                event:"UPDATE",

                schema:"public",

                table:"partidas",

                filter:
                    "id=eq." +
                    partidaActual.id

            },

            payload => {

                partidaActual =
                    payload.new;

                if(
                    partidaActual.estado ===
                    "finalizada"
                ){

                    mostrarFinalProfesor();

                    detenerTemporizadorGlobal();

                }

            }

        )
        .subscribe();

}


/* =====================================================
   MOSTRAR FINAL PROFESOR
===================================================== */

async function mostrarFinalProfesor(){

    detenerTemporizadorPregunta();

    detenerTemporizadorGlobal();


    document
        .getElementById(
            "quizProfesor"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "esperandoProfesor"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "finalProfesor"
        )
        .classList.remove("hidden");


    await cargarRanking(
        "rankingProfesor"
    );

}


/* =====================================================
   MOSTRAR FINAL ESTUDIANTE
===================================================== */

async function mostrarFinalEstudiante(){

    detenerTemporizadorPregunta();

    detenerTemporizadorGlobal();


    document
        .getElementById(
            "quizEstudiante"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "esperandoEstudiante"
        )
        .classList.add("hidden");


    document
        .getElementById(
            "finalEstudiante"
        )
        .classList.remove("hidden");


    const { data: jugador } =
        await supabaseClient
        .from("jugadores")
        .select("*")
        .eq(
            "id",
            jugadorActual.id
        )
        .single();


    if(jugador){

        jugadorActual =
            jugador;


        document
            .getElementById(
                "miResultado"
            )
            .innerHTML =
                `
                <div>
                    🎯 ${jugador.puntos || 0} puntos
                </div>

                <div style="
                    font-size:18px;
                    margin-top:8px;
                    color:#555;
                ">
                    ✅ ${jugador.correctas || 0}
                    respuestas correctas
                </div>
                `;

    }


    await cargarRanking(
        "rankingEstudiante"
    );

}


/* =====================================================
   CARGAR RANKING
===================================================== */

async function cargarRanking(elementId){

    const { data, error } =
        await supabaseClient
        .from("jugadores")
        .select("*")
        .eq(
            "partida_id",
            partidaActual.id
        )
        .order(
            "puntos",
            {
                ascending:false
            }
        )
        .order(
            "correctas",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Error ranking:",
            error
        );

        return;

    }


    const contenedor =
        document.getElementById(
            elementId
        );


    contenedor.innerHTML =
        "";


    (data || []).forEach(
        (jugador,index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ranking-item";


            div.innerHTML = `

                <div class="posicion">
                    ${index + 1}
                </div>

                <div class="nombre-ranking">
                    ${escapeHtml(
                        jugador.nombre
                    )}
                </div>

                <div class="puntos-ranking">
                    ${jugador.puntos || 0} pts
                </div>

                <div class="correctas-ranking">
                    ${jugador.correctas || 0} ✅
                </div>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   INICIALIZACIÓN
===================================================== */

console.log(
    "Quiz iniciado correctamente"
);

</script>
