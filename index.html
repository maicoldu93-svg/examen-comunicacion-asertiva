<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        #estado {
            font-size: 18px;
            padding: 15px;
            border-radius: 10px;
            background: #eee;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🎮 Mi Quiz</h1>
        <div id="estado">Conectando con Supabase...</div>
    </div>

    <script>

        const SUPABASE_URL = "https://ohmtgkmbrxwtalyamdcg.supabase.co";

        const SUPABASE_KEY = "sb_publishable_ec57o1PkClVIioHISyei8A_v_Qj619r";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        async function probarConexion() {

            const estado = document.getElementById("estado");

            const { data, error } = await supabase
                .from("partidas")
                .select("*")
                .limit(1);

            if (error) {

                console.error(error);

                estado.innerHTML =
                    "❌ Error de conexión<br><small>" +
                    error.message +
                    "</small>";

                estado.style.background = "#ffd6d6";

            } else {

                console.log(data);

                estado.innerHTML =
                    "✅ ¡Conectado correctamente con Supabase!";

                estado.style.background = "#d6ffd9";
            }
        }


        probarConexion();

    </script>

</body>
</html>
